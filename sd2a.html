  // ---------- 정답 chip + reveal, shared by every 대본 확인 page ----------
  // script123's questions are picture/graph choices (ring the correct photo in red); script46/78's
  // questions are plain text options, revealed the same way the real answer book does it — the
  // .opts list gets Mega_Answers.html's own .opts2 right/wrong markup (강 checkmark, gray strike-through).
  function addAnswerReveal(pageEl, answersList){
    var hd = pageEl.querySelector(".haeseol-hd");
    if (!hd) return;
    // wrap the heading's existing text FIRST, before the word-glossary pass runs — .haeseol-hd is a flex
    // row (heading vs. button), and without this wrapper each word-span the glossary pass creates would
    // become its own flex child and get spread apart by justify-content:space-between.
    var hdText = document.createElement("span");
    hdText.className = "hd-text";
    while (hd.firstChild) hdText.appendChild(hd.firstChild);
    hd.appendChild(hdText);
    var btn = document.createElement("button");
    btn.className = "chip-btn chip-green";
    btn.type = "button";
    btn.innerHTML = "<svg class='chip-ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M9 12l2 2 4-4'/></svg>" + "정답";
    hd.appendChild(btn);

    var blocks = pageEl.querySelectorAll(".haeseol");
    var revealed = false;

    function applyReveal(block, info){
      var correctIdx = CIRC.indexOf(info.ans);
      var cells = block.querySelectorAll(".pic-grid4 > div");
      if (cells.length) {
        cells.forEach(function(cell, ci){
          if (ci === correctIdx) cell.classList.add("correct");
        });
      } else {
        var ul = block.querySelector(".opts");
        if (ul) {
          ul.classList.add("opts2");
          var lis = ul.querySelectorAll("li");
          lis.forEach(function(li, li_i){
            if (li_i === correctIdx) {
              li.classList.add("right");
              var ck = document.createElement("span");
              ck.className = "ck";
              ck.textContent = " ✔ 정답";
              li.appendChild(ck);
            } else {
              li.classList.add("wrong");
            }
          });
        }
      }
      // matches Mega_Answers.html's own markup verbatim: <span class="ans-tag">정답 ①</span> next to
      // the question number, and <div class="note"><span class="expl-lbl">해설:</span>...</div> below —
      // both already styled by the book's own CSS (Gaegu handwritten font, #1651B8).
      var qnEl = block.querySelector(".qn");
      if (qnEl && !block.querySelector(".ans-tag")) {
        var tag = document.createElement("span");
        tag.className = "ans-tag";
        tag.textContent = "정답 " + info.ans;
        qnEl.insertAdjacentElement("afterend", tag);
      }
      // 해설 prose isn't always available (e.g. plain reading questions) — only render the note
      // when the book's own answer key actually has explanation text for this question.
      if (info.text) {
        var note = document.createElement("div");
        note.className = "note";
        var lbl = document.createElement("span");
        lbl.className = "expl-lbl";
        lbl.textContent = "해설:";
        note.appendChild(lbl);
        note.appendChild(document.createTextNode(info.text));
        block.appendChild(note);
      }
    }

    // undoes exactly what applyReveal added/changed, so a second click on 정답 returns the page
    // to its original, unrevealed state instead of being a one-way action.
    function removeReveal(block){
      block.querySelectorAll(".pic-grid4 > div.correct").forEach(function(c){ c.classList.remove("correct"); });
      var ul = block.querySelector(".opts");
      if (ul) {
        ul.classList.remove("opts2");
        ul.querySelectorAll("li").forEach(function(li){
          li.classList.remove("right", "wrong");
          var ck = li.querySelector(".ck");
          if (ck) ck.remove();
        });
      }
      var tag = block.querySelector(".ans-tag");
      if (tag) tag.remove();
      var note = block.querySelector(".note");
      if (note) note.remove();
    }

    btn.onclick = function(){
      stopAllAudio(); // checking (or un-checking) the answer shouldn't compete with the listening clip
      revealed = !revealed;
      btn.innerHTML = "<svg class='chip-ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M9 12l2 2 4-4'/></svg>" + (revealed ? "정답 표시됨" : "정답");
      blocks.forEach(function(block, i){
        var info = answersList[i];
        if (!info) return;
        if (revealed) applyReveal(block, info); else removeReveal(block);
      });
    };
  }
  // r4_s0103 intentionally has no addAnswerReveal call — R4's own answer key never recorded a
  // 정답 for Q1-3 (see the ANSWERS_R4 comment above); adding a reveal button with no correct
  // answer to show would silently mark nothing right, so the button is omitted instead.
  // r5_s0103 intentionally has no addAnswerReveal call — same source gap as R4 (see comment above).
  // r6_s0103 intentionally has no addAnswerReveal call — same source gap as R4/R5.
  // ---------- 읽기 정답 chip + reveal — right/wrong only, no 해설 ----------
  // reading questions never had a separate 대본/정답 확인 page the way listening did, so there's no
  // .haeseol structure to reuse; the button sits inline next to the page's own instruction line(s)
  // and marks every .qwrap's .opts list on the page in one click — same opts2/right/wrong/ck visual
  // treatment as listening's text-option reveal, just without the note/ans-tag (the book's own
  // reading answer key is a bare letter-per-question table, nothing to quote as 해설).
  function addReadingAnswerReveal(pageEl, answersList){
    var instrs = pageEl.querySelectorAll(".instr");
    if (!instrs.length) return;
    var lastInstr = instrs[instrs.length - 1];
    var row = document.createElement("div");
    row.className = "instr-row-answer";
    var btn = document.createElement("button");
    btn.className = "chip-btn chip-green";
    btn.type = "button";
    btn.innerHTML = "<svg class='chip-ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M9 12l2 2 4-4'/></svg>" + "정답";
    lastInstr.parentNode.insertBefore(row, lastInstr);
    row.appendChild(lastInstr);
    row.appendChild(btn);

    var qwraps = pageEl.querySelectorAll(".qwrap");
    var revealed = false;

    function applyReveal(qwrap, ans){
      var ul = qwrap.querySelector(".opts");
      if (!ul) return;
      var correctIdx = CIRC.indexOf(ans);
      ul.classList.add("opts2");
      ul.querySelectorAll("li").forEach(function(li, li_i){
        if (li_i === correctIdx) {
          li.classList.add("right");
          var ck = document.createElement("span");
          ck.className = "ck";
          ck.textContent = " ✔ 정답";
          li.appendChild(ck);
        } else {
          li.classList.add("wrong");
        }
      });
    }
    function removeReveal(qwrap){
      var ul = qwrap.querySelector(".opts");
      if (!ul) return;
      ul.classList.remove("opts2");
      ul.querySelectorAll("li").forEach(function(li){
        li.classList.remove("right", "wrong");
        var ck = li.querySelector(".ck");
        if (ck) ck.remove();
      });
    }
    btn.onclick = function(){
      revealed = !revealed;
      btn.innerHTML = "<svg class='chip-ic' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M9 12l2 2 4-4'/></svg>" + (revealed ? "정답 표시됨" : "정답");
      qwraps.forEach(function(qwrap, i){
        var ans = answersList[i];
        if (!ans) return;
        if (revealed) applyReveal(qwrap, ans); else removeReveal(qwrap);
      });
    };
  }
  // ---------- word/grammar-glossary tooltip ----------
  // .gw = a content word, tooltip shows its dictionary (citation) form + a plain gloss.
  // .gg = a grammar particle/pattern, tooltip shows the pattern's textbook label + meaning.
  // simple politeness/tense endings (요, 습니다, 이에요, 았/었어요...) are left as plain, unclickable
  // text — per the source book's own printed form, nothing about them needs a separate explanation.
  var tip = document.getElementById("word-tip");
  function showTip(x, y, kr, uz, isGrammar){
    tip.classList.toggle("is-grammar", !!isGrammar);
    tip.querySelector(".kr").textContent = kr;
    tip.querySelector(".uz").textContent = uz;
    tip.style.display = "block";
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = x - tw/2; if (left < 6) left = 6; if (left+tw > window.innerWidth-6) left = window.innerWidth-6-tw;
    tip.style.left = left+"px";
    tip.style.top = (y - th - 14)+"px";
  }
  document.addEventListener("click", function(e){
    if (e.target.classList && (e.target.classList.contains("gw") || e.target.classList.contains("gg"))) {
      var isGrammar = e.target.classList.contains("gg");
      var r = e.target.getBoundingClientRect();
      showTip(r.left + r.width/2, r.top, e.target.dataset.kr, e.target.dataset.uz, isGrammar);
      e.stopPropagation();
    } else if (!tip.contains(e.target)) {
      tip.style.display = "none";
    }
  });

  var SVG_NS = "http://www.w3.org/2000/svg";
  function makeSpan(text, kind, ref, svg) {
    if (kind === "plain") return document.createTextNode(text);
    var span = svg ? document.createElementNS(SVG_NS, "tspan") : document.createElement("span");
    if (kind === "word") {
      span.setAttribute("class", "gw");
      span.dataset.kr = ref;
      span.dataset.uz = WORD_DICT[ref] || "";
    } else {
      span.setAttribute("class", "gg");
      span.dataset.kr = ref;
      span.dataset.uz = GRAMMAR_DICT[ref] || "";
    }
    span.textContent = text;
    return span;
  }

  // splits a run of text into MORPHS/WORD_DICT-matched pieces, same rule set whether the pieces end
  // up as HTML <span>s (book text) or SVG <tspan>s (the Q3 chart's own in-picture labels).
  function splitIntoSpans(text, svg) {
    var pieces = [];
    var i = 0;
    while (i < text.length) {
      var rest = text.slice(i);
      var m = rest.match(/^[\uAC00-\uD7A3]+/);
      if (m) {
        var word = m[0];
        if (MORPHS[word]) {
          MORPHS[word].forEach(function(chunk){ pieces.push(makeSpan(chunk.t, chunk.k, chunk.r, svg)); });
        } else if (WORD_DICT[word]) {
          pieces.push(makeSpan(word, "word", word, svg));
        } else {
          pieces.push(document.createTextNode(word));
        }
        i += word.length;
      } else {
        var m2 = rest.match(/^[^\uAC00-\uD7A3]+/);
        var chunk = m2 ? m2[0] : rest[0];
        pieces.push(document.createTextNode(chunk));
        i += chunk.length;
      }
    }
    return pieces;
  }

  // the Q3 chart's percentage/category labels are drawn as inline SVG <text> — an HTML <span> isn't
  // valid inside SVG (it silently blanks the label, leaving only its colored background rect visible),
  // so each word becomes an SVG <tspan> instead, which supports the exact same class/dataset/click handling.
  function wrapSvgText(textEl) {
    var text = textEl.textContent;
    if (!/[\uAC00-\uD7A3]/.test(text)) return;
    var pieces = splitIntoSpans(text, true);
    while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
    pieces.forEach(function(p){ textEl.appendChild(p); });
  }

  // every whitespace-separated Korean eojeol is checked against MORPHS first (a hand-annotated
  // stem+ending split, e.g. "구할까" -> word 구하다 + grammar -(으)ㄹ까 봐), then falls back to a
  // whole-token WORD_DICT lookup for already-bare nouns/adverbs; anything unmatched stays plain text.
  function wrapDictInNode(node) {
    if (node.nodeType === 3) {
      var text = node.nodeValue;
      if (!/[\uAC00-\uD7A3]/.test(text)) return;
      var frag = document.createDocumentFragment();
      splitIntoSpans(text, false).forEach(function(p){ frag.appendChild(p); });
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === 1) {
      // an SVG <text> is handled and fully rebuilt by wrapSvgText itself — recursing into its
      // now-tspan children here would re-scan text nodes wrapSvgText already classified, so stop.
      if (node instanceof SVGTextElement) { wrapSvgText(node); return; }
      if (node.classList && (node.classList.contains("gw") || node.classList.contains("gg") || node.tagName === "SCRIPT" || node.tagName === "STYLE")) return;
      // every other node — including the <svg>/<g> wrapper around the Q3 chart — still needs its
      // children visited normally so any nested <text> elements are actually reached.
      var kids = Array.prototype.slice.call(node.childNodes);
      kids.forEach(wrapDictInNode);
    }
  }

  ORDER.forEach(function(key){
    var root = pagesEls[key];
    // every word on the page is clickable, including the 어휘 footer's own listed words and Uzbek
    // translations line (harmless to wrap Uzbek text too — it simply never matches WORD_DICT).
    Array.prototype.forEach.call(root.childNodes, function(child){
      if (child.nodeType === 1 && child.matches && child.matches(".pagenum")) return;
      wrapDictInNode(child);
    });
  });

  scaleStage();
  updatePageChrome();
})();
</script>










<script type="module">
// Draw each page from the book's PDF at the resolution it is actually displayed at, so zooming in
// re-renders sharply instead of magnifying pixels.
// PDF.js 4 relies on Promise.withResolvers (Chrome 119+, Safari 17.4+); older browsers get a shim.
if (!Promise.withResolvers) Promise.withResolvers = function () { let resolve, reject; const promise = new Promise((a, b) => { resolve = a; reject = b; }); return { promise, resolve, reject }; };
const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs");
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

const PAGES = 112;
const note = document.getElementById("pdf-note");
const pageEls = Array.from({ length: PAGES }, (_, i) => document.querySelector('.page[data-key="p' + (i + 1) + '"]'));
const rendered = new Map();          // page number -> scale it was drawn at
const inflight = new Map();          // page number -> running render task
let doc = null;

const cssWidth = () => pageEls[0].clientWidth || 794;
function targetScale(viewportWidth) {
  const stage = document.getElementById("stage-inner");
  const m = /scale\(([\d.]+)\)/.exec(stage.style.transform || "");
  const shown = (m ? +m[1] : 1) * cssWidth() * (window.devicePixelRatio || 1);
  return Math.min(4.5, Math.max(1.2, shown / viewportWidth));
}

async function draw(n) {
  if (!doc) return;
  const el = pageEls[n - 1];
  const page = await doc.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const scale = targetScale(base.width);
  if ((rendered.get(n) || 0) >= scale - 0.05) return;
  const running = inflight.get(n);
  if (running) { try { running.cancel(); } catch (e) {} inflight.delete(n); }
  const viewport = page.getViewport({ scale });
  const canvas = el.querySelector("canvas");
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  const task = page.render({ canvasContext: canvas.getContext("2d", { alpha: false }), viewport });
  inflight.set(n, task);
  try {
    await task.promise;
    rendered.set(n, scale);
    el.classList.remove("pending");
  } catch (e) {
    rendered.delete(n);            // cancelled or failed — let a later pass retry
  } finally {
    if (inflight.get(n) === task) inflight.delete(n);
  }
}

// keep canvases only around the viewport; far pages give their memory back
function release(n) {
  if (inflight.has(n)) return;
  const c = pageEls[n - 1].querySelector("canvas");
  if (!c.width) return;
  c.width = c.height = 0;
  rendered.delete(n);
  pageEls[n - 1].classList.add("pending");
}

function nearPages() {
  const out = [];
  pageEls.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    if (r.bottom > -window.innerHeight && r.top < window.innerHeight * 2) out.push(i + 1);
  });
  return out;
}

let pass = 0;
async function refresh() {
  const mine = ++pass;
  const near = nearPages();
  const keep = new Set(near);
  for (let i = 0; i < near.length; i += 2) {
    if (mine !== pass) return;                       // a newer pass took over
    await Promise.all(near.slice(i, i + 2).map(draw));
  }
  rendered.forEach((_, n) => { if (!keep.has(n) && (n < near[0] - 4 || n > near[near.length - 1] + 4)) release(n); });
}

let t = null;
const onChange = () => { clearTimeout(t); t = setTimeout(refresh, 180); };
document.getElementById("stage-outer").addEventListener("scroll", onChange, { passive: true });
window.addEventListener("resize", onChange);
new MutationObserver(onChange).observe(document.getElementById("stage-inner"), { attributes: true, attributeFilter: ["style"] });

(async () => {
  try {
    // linearized PDF + 1 MB range chunks: page 1 arrives in a couple of requests, not dozens
    doc = await pdfjsLib.getDocument({ url: "books_pdf/sd2a.pdf", rangeChunkSize: 1048576, disableAutoFetch: true }).promise;
    await refresh();
    note.classList.add("hidden");                  // only once the first pages are actually on screen
  } catch (e) {
    note.textContent = "Kitob ochilmadi — sahifani yangilang (" + (e && e.message ? e.message : "xato") + ")";
    note.classList.add("error");
  }
})();
</script>
